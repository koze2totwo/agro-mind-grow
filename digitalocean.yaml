spec:
  name: agro-mind-grow
  region: nyc
  services:
  - name: backend
    source_dir: backend
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: mayank8868/agro-mind-grow
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
    - path: /api
    envs:
    - key: PORT
      value: "8000"
